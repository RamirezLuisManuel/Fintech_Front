services:
  - type: web
    name: fintech-gestopago-web
    runtime: static
    buildCommand: bash ./render-build.sh
    staticPublishPath: ./build/web
    envVars:
      - key: API_BASE_URL
        value: https://tu-backend-fintech.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

